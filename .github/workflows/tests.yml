name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync dependencies (incl. dev group)
        run: uv sync --group dev
      - name: Run the full test suite
        run: uv run pytest -q
        env:
          API_TEST_REDIS_URL: redis://127.0.0.1:6379/1
          E2E_TEST_REDIS_URL: redis://127.0.0.1:6379/2
