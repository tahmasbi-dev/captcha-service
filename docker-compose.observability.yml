# Metrics stack: Prometheus scrapes the API's /metrics endpoint, Grafana
# ships with the pre-provisioned CAPTCHA dashboard.
#
# docker compose -f docker-compose.observability.yml up -d
#
# f it via `include`, so this single command also brings the base
# stack (Redis + API) up if it isn't already running.
include:
  - docker-compose.yml

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: captcha-prometheus
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: captcha-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # Anonymous Viewer login: whoever opens :3000 lands straight on the
      # dashboard — the "reviewers see your metrics tab" experience.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
