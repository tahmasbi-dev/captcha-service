services:
  redis:
    image: redis:latest
    container_name: captcha-redis
    ports:
      # 127.0.0.1 binding — don't expose Redis to the LAN in dev.
      - "127.0.0.1:6379:6379"
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy volatile-lru
      --save ""
      --appendonly no
      --loglevel notice
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  api:
    build: .
    container_name: captcha-api
    ports:
      # 127.0.0.1 binding — don't expose the API to the LAN in dev.
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      # Inside the compose network, Redis is the `redis` service, not localhost.
      CAPTCHA_REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes: {}