[project]
name = "captcha-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "tahmasbi-dev", email = "thebasedcoder@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "captcha>=0.7.1",
    "fastapi>=0.162.0",
    "prometheus-client>=0.26.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.12.0",
    "redis>=8.1.0",
    "uvicorn[standard]>=0.38.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
log_cli = false

# Redis for integration tests. The dev compose exposes it on loopback;
# tests use db 1/2 and flush them per session (never the app's db 0).

[project.scripts]
captcha-service = "captcha_service:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
